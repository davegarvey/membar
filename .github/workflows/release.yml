name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Verify native runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          swift --version

      - name: Verify release signing configuration
        if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for variable in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "$(printenv "$variable")" ]; then
              printf 'Missing required secret: %s\n' "$variable" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Import Developer ID certificate
        if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Configure notarization credentials
        if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "membar-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build unsigned application archive
        if: ${{ vars.RELEASE_SIGNING_ENABLED != 'true' }}
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}" sh Scripts/package-app.sh

      - name: Build signed and notarized application archive
        if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: membar-notary
        run: |
          VERSION="${VERSION#v}" sh Scripts/package-app.sh

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: Membar-${{ matrix.arch }}
          path: |
            dist/Membar-*.zip
            dist/Membar-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download application archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/Membar-${VERSION}-arm64.zip \
              dist/Membar-${VERSION}-arm64.zip.sha256 \
              dist/Membar-${VERSION}-x86_64.zip \
              dist/Membar-${VERSION}-x86_64.zip.sha256 \
              --repo "${GH_REPO}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              "dist/Membar-${VERSION}-arm64.zip" \
              "dist/Membar-${VERSION}-arm64.zip.sha256" \
              "dist/Membar-${VERSION}-x86_64.zip" \
              "dist/Membar-${VERSION}-x86_64.zip.sha256" \
              --generate-notes
          fi
