name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" sh Scripts/package-app.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Membar-${GITHUB_REF_NAME#v}-arm64.zip" \
            "dist/Membar-${GITHUB_REF_NAME#v}-arm64.zip.sha256" \
            --generate-notes
