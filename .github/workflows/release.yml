name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Verify native runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          swift --version

      - name: Build application archive
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}" sh Scripts/package-app.sh

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: Membar-${{ matrix.arch }}
          path: |
            dist/Membar-*.zip
            dist/Membar-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download application archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Membar-${VERSION}-arm64.zip" \
            "dist/Membar-${VERSION}-arm64.zip.sha256" \
            "dist/Membar-${VERSION}-x86_64.zip" \
            "dist/Membar-${VERSION}-x86_64.zip.sha256" \
            --generate-notes
