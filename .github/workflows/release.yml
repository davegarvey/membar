name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Verify native runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          swift --version

      - name: Build application archive
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${VERSION#v}" sh Scripts/package-app.sh

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: Membar-${{ matrix.arch }}
          path: |
            dist/Membar-*.zip
            dist/Membar-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download application archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/Membar-${VERSION}-arm64.zip \
              dist/Membar-${VERSION}-arm64.zip.sha256 \
              dist/Membar-${VERSION}-x86_64.zip \
              dist/Membar-${VERSION}-x86_64.zip.sha256 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --target "${RELEASE_TAG}" \
              "dist/Membar-${VERSION}-arm64.zip" \
              "dist/Membar-${VERSION}-arm64.zip.sha256" \
              "dist/Membar-${VERSION}-x86_64.zip" \
              "dist/Membar-${VERSION}-x86_64.zip.sha256" \
              --generate-notes
          fi
